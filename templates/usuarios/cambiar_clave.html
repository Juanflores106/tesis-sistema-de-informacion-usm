{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block titulo %}Cambiar contraseña{% endblock %}

{% block contenido %}
<div class="row">
  <div class="col-lg-6">
    <h1 class="h3 mb-3">Cambiar contraseña</h1>
    <form method="post" novalidate class="card shadow-sm">
      {% csrf_token %}
      <div class="card-body">
        {{ form|crispy }}
      </div>
      <div class="card-footer d-flex justify-content-end gap-2">
        <a href="{% url 'inicio' %}" class="btn btn-outline-secondary">Cancelar</a>
        <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Guardar</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
